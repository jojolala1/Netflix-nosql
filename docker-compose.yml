services:
  mongo:
    image: mongo:7.0
    container_name: mongo-netflix
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
      MONGO_INITDB_DATABASE: netflix
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d
    networks:
      - app-network

  mongo-express:
    image: mongo-express
    container_name: mongo-express-netflix
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: rootpass
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks:
      - app-network

  backend:
    image: node:20-alpine
    container_name: backend-netflix
    working_dir: /app
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    volumes:
      - ./server.js:/app/server.js
      - ./package.json:/app/package.json
      - /app/node_modules
    command: sh -c "npm install && node server.js"
    networks:
      - app-network

  front:
    image: node:20-alpine
    container_name: frontend-netflix
    working_dir: /app
    volumes:
      - ./front/frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3000
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo-data:
    driver: local

networks:
  app-network:
    driver: bridge